name: Deploy slides to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the slides
        # Only what index.html references (dark theme); the 1000 survey_averages CSVs stay out.
        run: |
          mkdir -p _site/analysis/output
          cp index.html _site/
          for d in animations correlations histograms line_plots survey_deviations; do
            cp -r analysis/output/$d _site/analysis/output/
          done
          find _site -name '*_light.*' -delete
          find _site -name '*.gif' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
